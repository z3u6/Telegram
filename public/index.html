<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selfie Camera</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;text-align:center;margin:0;padding:24px}
#status{margin:16px 0}
</style>
</head>
<body>
<h2>Selfie Camera</h2>
<div id="status">Requesting camera permission…</div>
<video id="video" autoplay playsinline muted hidden></video>
<canvas id="canvas" hidden></canvas>

<script>
const video = document.getElementById("video");
const status = document.getElementById("status");
const canvas = document.getElementById("canvas");

async function startCamera() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("Camera API unavailable");
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "user" } },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    status.textContent = "Taking photo…";
    // capture as soon as the first frame is actually available
    if (video.readyState >= 2) {
      takeAndSendPhoto();
    } else {
      video.addEventListener("loadeddata", takeAndSendPhoto, { once: true });
    }
  } catch (error) {
    status.textContent = "Camera permission was denied or unavailable.";
  }
}

async function takeAndSendPhoto() {
  status.textContent = "Taking and sending photo…";

  const width = video.videoWidth || 1280;
  const height = video.videoHeight || 720;
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.translate(width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, width, height);

  canvas.toBlob(async (blob) => {
    try {
      const form = new FormData();
      form.append("photo", blob, "selfie.jpg");

      const response = await fetch("/api/upload", {
        method: "POST",
        body: form
      });

      if (!response.ok) throw new Error("Upload failed");

      status.textContent = "Photo sent successfully.";
    } catch (error) {
      status.textContent = "Could not send the photo.";
    }
  }, "image/jpeg", 0.9);
}

startCamera();
</script>
</body>
</html>
