<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selfie Camera</title>
<style>
body{margin:0;padding:20px;background:#111;color:#fff;font-family:Arial;text-align:center}
video{width:100%;max-width:500px;border-radius:12px;margin:15px auto;display:block}
button{padding:13px 20px;margin:6px;border:0;border-radius:8px;font-size:16px;cursor:pointer}
#start{background:#2196f3;color:#fff}
#send{background:#4caf50;color:#fff}
button:disabled{opacity:.5}
#message{color:#ccc}
</style>
</head>
<body>
<h1>Selfie Camera</h1>
<p id="message">Press Start Camera and allow camera access.</p>
<video id="video" autoplay playsinline></video>
<button id="start">Start Camera</button>
<button id="send" disabled>Take &amp; Send Photo</button>

<script>
const video = document.getElementById("video");
const start = document.getElementById("start");
const send = document.getElementById("send");
const message = document.getElementById("message");
let stream;

start.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });
    video.srcObject = stream;
    start.disabled = true;
    send.disabled = false;
    message.textContent = "Camera ready. Press Take & Send Photo.";
  } catch (e) {
    console.error(e);
    message.textContent = "Camera permission was denied or the camera is unavailable.";
  }
};

send.onclick = async () => {
  if (!stream) return;

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);

  send.disabled = true;
  message.textContent = "Sending photo...";

  canvas.toBlob(async blob => {
    try {
      const form = new FormData();
      form.append("photo", blob, "selfie.jpg");

      const response = await fetch("/api/upload", {
        method: "POST",
        body: form
      });

      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(result.error || "Upload failed");
      }

      message.textContent = "Photo sent successfully.";
    } catch (e) {
      console.error(e);
      message.textContent = "Could not send the photo. Please try again.";
      send.disabled = false;
    }
  }, "image/jpeg", 0.9);
};

window.addEventListener("beforeunload", () => {
  if (stream) stream.getTracks().forEach(track => track.stop());
});
</script>
</body>
</html>
